name: one-shot-fix-final-delivery-test

on:
  push:
    branches:
      - feature/interpretation-corpus-consolidated

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/interpretation-corpus-consolidated
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/chartFile.ts')
          text = path.read_text()
          old = '  assert(chart.system.points.sun.summary.trim().length > 0, "recovered interpretation must contain prose");'
          new = '  assert((chart.system.points.sun.summary ?? "").trim().length > 0, "recovered interpretation must contain prose");'
          if old not in text:
              raise SystemExit('nullable summary assertion marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/chartFile.ts
          git commit -m "Fix final delivery regression nullable summary assertion"
          git push origin HEAD:feature/interpretation-corpus-consolidated
