name: tmp-headless-rerun
on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-headless-rerun.yml]
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/split-modules
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build compatibility-preserving headless composition
        run: |
          set -euo pipefail
          BASE=86fadaebccb497930f6a38a4a8f5c4c15b2c2ff6
          CORE=6828983efa62da9d59c19c33f32a632a5587857d
          INTERPRETER=b64a7e74b9a510c923a1c2a0a00e5df0235cc9a3
          PACKAGER=402a167bcd8d74c1d1ac2f8bace6d08ecea3c8b9

          rm -rf /tmp/astrology-base
          mkdir -p /tmp/astrology-base
          git archive "$BASE" \
            src/file src/generate src/interface src/cli.ts src/types/legacy.ts \
            test/publicCompatibility.ts test/interfaces.ts test/generationSemanticProvider.ts \
            test/recoveryMigration.ts test/service.ts test/chartFile.ts \
            | tar -x -C /tmp/astrology-base

          rm -rf src public scripts docs test vendor dist .test package-lock.json
          rm -f .gitmodules
          git rm -r --cached vendor 2>/dev/null || true
          mkdir -p src/calculate src/file src/generate src/interface src/types test
          cp -a /tmp/astrology-base/src/file/. src/file/
          cp -a /tmp/astrology-base/src/generate/. src/generate/
          cp -a /tmp/astrology-base/src/interface/. src/interface/
          cp /tmp/astrology-base/src/cli.ts src/cli.ts
          cp /tmp/astrology-base/src/types/legacy.ts src/types/legacy.ts
          cp /tmp/astrology-base/test/*.ts test/

          cat > src/types/base.ts <<'TS'
          export type { BirthData, Calc, CalcReason, CalcStatus, Json, JsonRef, PlaceData, TimeData, TimeWindow } from "astral-core";
          export type { PreferredGender } from "astral-interpreter/web";
          import type { PreferredGender } from "astral-interpreter/web";

          export interface BirthInput {
            date: string;
            time?: string | null;
            timeAccuracy?: "exact" | "approximate" | "unknown";
            placeId: string;
            name?: string;
            lang?: string;
            preferredGender?: PreferredGender;
          }

          export const preferredGenderOf = (value: { preferredGender?: PreferredGender }): PreferredGender =>
            value.preferredGender ?? "male";
          TS

          cat > src/types/astro.ts <<'TS'
          export * from "astral-core";
          TS
          cat > src/types/chart.ts <<'TS'
          export type { AstralChart } from "astral-interpreter/web";
          TS
          cat > src/types/progress.ts <<'TS'
          export type ProgressStage =
            | "validated"
            | "calculated"
            | "foundation"
            | "wave"
            | "synthesis"
            | "audited"
            | "assembled"
            | "complete"
            | "failed";
          export interface ProgressEvent {
            stage: ProgressStage;
            complete: number;
            total: number;
            message: string;
            unitId?: string;
          }
          TS
          cat > src/types/file.ts <<'TS'
          import type { AstralCalculation, AstralChart, InterpretationUnit } from "astral-interpreter/web";
          export type { AstralCalculation, InterpretationUnit } from "astral-interpreter/web";

          export interface AstralCrc {
            schema: "astral-crc/1.0.0";
            canonicalisation: "RFC8785";
            encoding: "utf-8";
            scope: ["schema", "astral-calculation", "astral-chart"];
            byteLength: number;
            sha256: string;
            sha512: string;
            crc32c: string;
          }
          export type EncodedPublicKey = `base64url:${string}`;
          export type EncodedSignature = `base64url:${string}`;
          export type KeyId = `sha256:${string}`;
          export type SignedDigest = `sha256:${string}`;
          export interface AstralAuthority {
            schema: "astral-authority/1.0.0";
            algorithm: "Ed25519";
            canonicalisation: "RFC8785";
            encoding: "utf-8";
            scope: ["schema", "astral-calculation", "astral-chart", "crc"];
            issuer: string;
            keyId: KeyId;
            publicKey: EncodedPublicKey;
            signature: EncodedSignature;
            signedSha256: SignedDigest;
            generatedAt: string;
          }
          export interface AstralFile {
            schema: "astral/1.1.0";
            "astral-calculation": AstralCalculation;
            "astral-chart": AstralChart;
            crc: AstralCrc;
            authority: AstralAuthority | null;
          }
          export interface TrustedAuthority {
            issuer: string;
            keyId: string;
            publicKey: string;
            status: "active" | "retired" | "revoked";
          }
          export interface AstralValidation {
            structure: "valid" | "invalid";
            integrity: "valid" | "modified" | "invalid_crc" | "unsupported";
            authority: "trusted" | "valid_untrusted" | "invalid" | "unsigned" | "unknown_key" | "revoked";
          }
          TS
          cat > src/types/index.ts <<'TS'
          export * from "./base.js";
          export * from "./astro.js";
          export * from "./chart.js";
          export * from "./file.js";
          export * from "./legacy.js";
          export * from "./progress.js";
          TS

          cat > src/config.ts <<'TS'
          import type { Ayanamsha, Zodiac } from "astral-core";
          import { readConfig as readInterpreterConfig, type Config as InterpreterConfig } from "astral-interpreter/web";
          export type Env = Readonly<Record<string, string | undefined>>;
          export type Config = Omit<InterpreterConfig, "chart"> & {
            chart: InterpreterConfig["chart"] & {
              primaryZodiac: Zodiac;
              ayanamsha: Ayanamsha;
              interpretationMode: Zodiac;
            };
            signing: {
              enabled: boolean;
              issuer: string;
              privateKey: string | null;
              publicKey: string | null;
            };
          };
          const oneOf = <T extends string>(value: string | undefined, fallback: T, values: readonly T[], key: string): T => {
            const selected = value ?? fallback;
            if (!values.includes(selected as T)) throw new Error(`${key} has an unsupported value`);
            return selected as T;
          };
          const bool = (value: string | undefined, fallback: boolean, key: string): boolean => {
            if (value === undefined || value === "") return fallback;
            if (value === "true") return true;
            if (value === "false") return false;
            throw new Error(`${key} must be true or false`);
          };
          export const readConfig = (env: Env): Config => {
            const interpreter = readInterpreterConfig(env);
            const primaryZodiac = oneOf(env["ASTRAL_PRIMARY_ZODIAC"], "tropical", ["tropical", "sidereal"] as const, "ASTRAL_PRIMARY_ZODIAC");
            if (env["ASTRAL_INTERPRETATION_MODE"] === "both") throw new Error("ASTRAL_INTERPRETATION_MODE=both is no longer supported; create separate tropical and sidereal charts");
            const interpretationMode = oneOf(env["ASTRAL_INTERPRETATION_MODE"], primaryZodiac, ["tropical", "sidereal"] as const, "ASTRAL_INTERPRETATION_MODE");
            if (primaryZodiac !== interpretationMode) throw new Error("ASTRAL_PRIMARY_ZODIAC and ASTRAL_INTERPRETATION_MODE must select the same zodiac");
            const signingEnabled = bool(env["ASTRAL_SIGNING_ENABLED"], false, "ASTRAL_SIGNING_ENABLED");
            const privateKey = env["ASTRAL_ED25519_PRIVATE_KEY"] || null;
            const publicKey = env["ASTRAL_ED25519_PUBLIC_KEY"] || null;
            if (signingEnabled && (!privateKey || !publicKey)) throw new Error("Signing requires both Ed25519 keys");
            return {
              ...interpreter,
              chart: {
                ...interpreter.chart,
                primaryZodiac,
                ayanamsha: oneOf(env["ASTRAL_SIDEREAL_AYANAMSHA"], "lahiri", ["lahiri", "fagan_bradley", "krishnamurti", "raman"] as const, "ASTRAL_SIDEREAL_AYANAMSHA"),
                interpretationMode,
              },
              signing: {
                enabled: signingEnabled,
                issuer: env["ASTRAL_AUTHORITY_ISSUER"] ?? "kitty-crow/astral-charts",
                privateKey,
                publicKey,
              },
            };
          };
          TS

          cat > src/calculate/service.ts <<'TS'
          import { CalcError, calc, loadPorts, type Ayanamsha, type CalcPorts, type Zodiac } from "astral-core";
          import { prepare, type AstralCalculation, type Subject } from "astral-interpreter/web";
          import type { Config } from "../config.js";
          import { preferredGenderOf, type BirthInput } from "../types/base.js";

          export interface CalculationOptions {
            primaryZodiac: Zodiac;
            ayanamsha: Ayanamsha;
            interpretationMode: Zodiac;
          }
          export type CalculationPorts = CalcPorts;
          export class CalculationUnavailableError extends CalcError {}
          const optionsFromConfig = (config: Config): CalculationOptions => ({
            primaryZodiac: config.chart.primaryZodiac,
            ayanamsha: config.chart.ayanamsha,
            interpretationMode: config.chart.interpretationMode,
          });
          const coreInput = (input: BirthInput) => ({
            date: input.date,
            time: input.time ?? null,
            timeAccuracy: input.timeAccuracy ?? (input.time == null ? "unknown" as const : "exact" as const),
            placeId: input.placeId,
          });
          const subject = (input: BirthInput): Subject => ({
            ...(input.name === undefined ? {} : { name: input.name }),
            ...(input.lang === undefined ? {} : { language: input.lang }),
            gender: preferredGenderOf(input),
          });
          export class CalculationService {
            readonly #ports: CalculationPorts;
            constructor(ports: CalculationPorts) { this.#ports = ports; }
            async calculate(input: BirthInput, options: CalculationOptions): Promise<AstralCalculation> {
              if (options.primaryZodiac !== options.interpretationMode) {
                throw new Error("A chart must use one zodiac system; create a separate chart for the other system");
              }
              try {
                return prepare(await calc(coreInput(input), { zodiac: options.primaryZodiac, ayanamsha: options.ayanamsha }, this.#ports), subject(input));
              } catch (cause) {
                if (cause instanceof CalcError) throw new CalculationUnavailableError(cause.reason);
                throw cause;
              }
            }
          }
          export const loadCalculationPorts = async (version = "0.20.0"): Promise<CalculationPorts> => loadPorts(version);
          export const loadCalculationService = async (config: Config, version = "0.20.0"): Promise<{ service: CalculationService; options: CalculationOptions }> => ({
            service: new CalculationService(await loadCalculationPorts(version)),
            options: optionsFromConfig(config),
          });
          TS

          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in list(Path('src/generate').rglob('*.ts')) + list(Path('src/interface').rglob('*.ts')):
              s=p.read_text()
              s=re.sub(r'(["\'])\.\./(?:billing|chart|interpretation|llm|job|progress|ref)/[^"\']+\.js\1', lambda m: m.group(1)+'astral-interpreter/web'+m.group(1), s)
              s=re.sub(r'(["\'])\.\./place/(?:model|normalise|csc)\.js\1', lambda m: m.group(1)+'astral-core'+m.group(1), s)
              p.write_text(s)
          p=Path('src/generate/migration.ts')
          p.write_text(re.sub(r'(["\'])\.\./llm/orchestrate/types\.js\1', lambda m: m.group(1)+'astral-interpreter/web'+m.group(1), p.read_text()))
          p=Path('src/file/validate.ts')
          p.write_text(p.read_text().replace('from "../compat/catalogue.js"', 'from "astral-core"'))
          p=Path('src/cli.ts')
          p.write_text(p.read_text().replace('from "./billing/types.js"', 'from "astral-interpreter"'))

          for name in ['generationSemanticProvider.ts','recoveryMigration.ts']:
              p=Path('test')/name
              s=p.read_text()
              s=re.sub(r'(["\'])\.\./src/(?:interpretation|llm)/[^"\']+\.js\1', lambda m: m.group(1)+'astral-interpreter/web'+m.group(1), s)
              p.write_text(s)
          PY

          cat > src/interface/runtime.ts <<'TS'
          import { loadCscCatalogue } from "astral-core";
          import { BillStore, productionSemanticProvider } from "astral-interpreter";
          import type { Config } from "../config.js";
          import { loadCalculationService } from "../calculate/service.js";
          import { loadChartGenerationService } from "../generate/service.js";
          import type { ApiRuntime } from "./api.js";
          export interface LoadedApiRuntime extends ApiRuntime {
            bills: BillStore;
            openAiAdminKey: string | null;
          }
          export const loadApiRuntime = async (config: Config, version = "0.20.0"): Promise<LoadedApiRuntime> => {
            const [{ service, options }, places] = await Promise.all([loadCalculationService(config, version), loadCscCatalogue()]);
            const generator = config.openai.apiKey.trim().length === 0
              ? null
              : await loadChartGenerationService(config, version, {}, productionSemanticProvider);
            return {
              service,
              generator,
              options,
              places,
              version,
              bills: new BillStore(config.billing.directory),
              openAiAdminKey: config.openai.adminKey,
            };
          };
          TS

          cat > src/index.ts <<'TS'
          export * from "astral-core";
          export * from "astral-interpreter";
          export { auditPwd, open, pack, pwdOk, readMeta, readPub, readPubRaw, readWheel, pwdMin, Id } from "astral-packager";
          export { readConfig, type Config, type Env } from "./config.js";
          export { preferredGenderOf, type BirthInput } from "./types/base.js";
          export type { AstralCrc, AstralAuthority, AstralFile, AstralValidation, TrustedAuthority, EncodedPublicKey, EncodedSignature, KeyId, SignedDigest } from "./types/file.js";
          export type { LegacyAstralCalculation, LegacyAstralChart, LegacyAstralFile, ReadableAstralFile } from "./types/legacy.js";
          export type { ProgressEvent, ProgressStage } from "./types/progress.js";
          export * from "./calculate/service.js";
          export * from "./file/canonical.js";
          export * from "./file/codec.js";
          export * from "./file/crc32c.js";
          export * from "./file/hash.js";
          export * from "./file/integrity.js";
          export * from "./file/authority.js";
          export * from "./file/invariants.js";
          export * from "./file/document.js";
          export * from "./file/validate.js";
          export * from "./generate/service.js";
          export * from "./interface/request.js";
          export * from "./interface/api.js";
          export * from "./interface/runtime.js";
          export * from "./interface/server.js";
          export * from "./interface/cliArgs.js";
          TS

          cat > package.json <<'JSON'
          {
            "name": "astrology",
            "version": "0.21.0",
            "description": "Headless astrology API, CLI, file composition and generation runtime",
            "type": "module",
            "private": true,
            "license": "MIT",
            "bin": { "astrology": "./dist/cli.js" },
            "engines": { "node": ">=22" },
            "scripts": {
              "vendor:core": "npm --prefix vendor/astral-core run vendor:build && npm --prefix vendor/astral-core install --ignore-scripts && npm --prefix vendor/astral-core run build",
              "vendor:interpreter": "npm --prefix vendor/astral-interpreter run vendor:build && npm --prefix vendor/astral-interpreter ci && npm --prefix vendor/astral-interpreter run build",
              "vendor:packager": "npm --prefix vendor/astral-packager run build",
              "vendor:build": "npm run vendor:core && npm run vendor:interpreter && npm run vendor:packager",
              "check": "tsc -p tsconfig.json --noEmit",
              "build": "rm -rf dist && tsc -p tsconfig.build.json",
              "test": "rm -rf .test && tsc -p tsconfig.test.json && node .test/test/publicCompatibility.js && node .test/test/interfaces.js && node .test/test/service.js && node .test/test/chartFile.js && node .test/test/generationSemanticProvider.js && node .test/test/recoveryMigration.js",
              "ci": "npm run check && npm test && npm run build",
              "start": "node dist/cli.js serve"
            },
            "dependencies": {
              "astral-core": "file:vendor/astral-core",
              "astral-interpreter": "file:vendor/astral-interpreter",
              "astral-packager": "file:vendor/astral-packager"
            },
            "devDependencies": { "@types/node": "^22.15.3", "typescript": "^5.9.3" }
          }
          JSON
          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2023", "module": "NodeNext", "moduleResolution": "NodeNext", "lib": ["ES2023", "DOM"],
              "strict": true, "exactOptionalPropertyTypes": true, "noUncheckedIndexedAccess": true, "noImplicitOverride": true,
              "noFallthroughCasesInSwitch": true, "noImplicitReturns": true, "noPropertyAccessFromIndexSignature": true,
              "useUnknownInCatchVariables": true, "verbatimModuleSyntax": true, "skipLibCheck": false, "allowImportingTsExtensions": true
            },
            "include": ["src/**/*.ts"]
          }
          JSON
          cat > tsconfig.build.json <<'JSON'
          { "extends":"./tsconfig.json", "compilerOptions": { "noEmit":false, "allowImportingTsExtensions":false, "declaration":true, "declarationMap":true, "sourceMap":true, "outDir":"dist", "rootDir":"src" }, "include":["src/**/*.ts"] }
          JSON
          cat > tsconfig.test.json <<'JSON'
          { "extends":"./tsconfig.json", "compilerOptions": { "noEmit":false, "allowImportingTsExtensions":false, "outDir":".test", "rootDir":".", "declaration":false, "sourceMap":false }, "include":["src/**/*.ts","test/**/*.ts"] }
          JSON

          cat > .gitmodules <<'EOF'
          [submodule "vendor/astral-core"]
            path = vendor/astral-core
            url = https://github.com/Online-Arcana/astral-chart-wheel.git
          [submodule "vendor/astral-interpreter"]
            path = vendor/astral-interpreter
            url = https://github.com/Online-Arcana/astral-interpreter.git
          [submodule "vendor/astral-packager"]
            path = vendor/astral-packager
            url = https://github.com/Online-Arcana/astral-packager.git
          EOF
          git submodule add -f https://github.com/Online-Arcana/astral-chart-wheel.git vendor/astral-core
          git -C vendor/astral-core checkout "$CORE"
          git submodule add -f https://github.com/Online-Arcana/astral-interpreter.git vendor/astral-interpreter
          git -C vendor/astral-interpreter checkout "$INTERPRETER"
          git submodule add -f https://github.com/Online-Arcana/astral-packager.git vendor/astral-packager
          git -C vendor/astral-packager checkout "$PACKAGER"
          git submodule update --init --recursive

          cat > .github/workflows/ci.yml <<'YAML'
          name: CI
          on:
            push:
            pull_request:
          permissions:
            contents: read
          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v6
                  with:
                    submodules: recursive
                - uses: actions/setup-node@v6
                  with:
                    node-version: 22
                    cache: npm
                - run: npm run vendor:build
                - run: npm ci
                - run: npm run check
                - run: npm test
                - run: npm run build
          YAML

          cat > README.md <<'MD'
          # astrology

          Headless composition package for Online Arcana astrology.

          This repository owns the public API and CLI, chart generation orchestration, `.astral` document integrity/signing, and composition of the deterministic core, interpretation engine and packager.

          Deterministic calculation and browser-safe place data live in `astral-core`. Interpretation, auditing and OpenAI orchestration live in `astral-interpreter`. Browser UI lives in `astral-charts`. Identicon rendering lives in `astral-identicons`.

          ## Development

          ```sh
          git submodule update --init --recursive
          npm run vendor:build
          npm ci
          npm run check
          npm test
          npm run build
          ```
          MD

          npm run vendor:build
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run check
          npm test
          npm run build

          git rm -f .github/workflows/pages.yml .github/workflows/tmp-headless-split.yml .github/workflows/tmp-headless-rerun.yml 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git add -f dist
          git commit -m "Split astrology into headless composition"
          git fetch origin agent/split-modules
          git rebase origin/agent/split-modules
          git push origin HEAD:agent/split-modules
