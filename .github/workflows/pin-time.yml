name: Pin time submodule

on:
  push:
    branches: [agent/pin-time-96828b6]

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Pin vendor/time
        env:
          TARGET: 96828b6097da77b2de38171dfd1bf92c0df7edc7
          BRANCH: agent/pin-time-96828b6
        run: |
          set -Eeuo pipefail
          git -C vendor/time fetch --depth=1 origin main
          git -C vendor/time checkout --detach "$TARGET"
          test "$(git -C vendor/time rev-parse HEAD)" = "$TARGET"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/time
          git diff --cached --quiet && exit 0
          git commit -m "chore: update time submodule"
          git push origin "HEAD:$BRANCH"
