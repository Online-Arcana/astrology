name: tmp-consumer-boundary

on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-consumer-boundary.yml]

permissions:
  contents: write

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/split-modules
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Make consumer browser subpaths self-contained
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('src/web.ts')
          s=p.read_text()
          if 'type WheelData,' not in s:
              s=s.replace(
                  'export { renderWheel, wheelData, renderPublicWheel, fromPublic } from "astral-core/wheel";\nexport type { WheelData, PublicWheelMeta } from "astral-core/wheel";',
                  'export { renderWheel, wheelData, renderPublicWheel, fromPublic } from "astral-core/wheel";\nexport type { WheelData, PublicWheelMeta } from "astral-core/wheel";'
              )
          helper='''\nexport const astralWheelData = (calculation: AstralFile["astral-calculation"]): import("astral-core/wheel").WheelData => ({\n  fingerprint: calculation.provenance.calculationFingerprint,\n  primaryHouseSystem: calculation.settings.primaryHouseSystem,\n  points: calculation.system.points,\n  houses: calculation.system.houses,\n  aspects: calculation.system.aspects,\n});\n'''
          if 'export const astralWheelData' not in s:
              marker='export const webPlaceCatalogue'
              if marker not in s: raise SystemExit('web place catalogue anchor missing')
              s=s.replace(marker, helper+'\n'+marker)
          p.write_text(s)

          package=json.loads(Path('package.json').read_text())
          package['scripts']['build']='rm -rf dist data && node scripts/sync-data.mjs && tsc -p tsconfig.build.json && node scripts/sync-packager.mjs'
          Path('package.json').write_text(json.dumps(package, indent=2)+'\n')
          PY

          cat > scripts/sync-packager.mjs <<'JS'
          import { cp, mkdir, readFile, rm, writeFile } from "node:fs/promises";
          import { resolve } from "node:path";

          const source = resolve("vendor/astral-packager/dist");
          const runtime = resolve("dist/packager-runtime");
          await rm(runtime, { recursive: true, force: true });
          await mkdir(runtime, { recursive: true });
          await cp(source, runtime, { recursive: true });
          await writeFile(resolve("dist/packager.js"), 'export * from "./packager-runtime/index.js";\n', "utf8");
          await writeFile(resolve("dist/packager.d.ts"), await readFile(resolve(source, "index.d.ts"), "utf8"), "utf8");
          JS

          npm --prefix vendor/astral-packager run build
          npm ci
          npm run check
          npm test
          npm run build

          node --input-type=module - <<'NODE'
          const web = await import('./dist/web.js');
          if (typeof web.astralWheelData !== 'function') throw new Error('astralWheelData missing');
          const packager = await import('./dist/packager.js');
          for (const name of ['auditPwd','open','pack']) {
            if (typeof packager[name] !== 'function') throw new Error(`${name} missing`);
          }
          NODE

          ! grep -q 'from "astral-packager"' dist/packager.d.ts
          grep -q 'packager-runtime/index.js' dist/packager.js

          git restore --source=HEAD --staged --worktree .github/workflows || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/web.ts scripts/sync-packager.mjs package.json package-lock.json
          git add -f dist
          git commit -m "Harden browser consumer package boundaries"
          git pull --rebase origin agent/split-modules
          git push origin HEAD:agent/split-modules
