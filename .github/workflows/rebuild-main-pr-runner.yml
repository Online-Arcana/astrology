name: Run corrected main history rebuild

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebuild:
    if: github.head_ref == 'agent/rebuild-main-0.18.0' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: cdcbd5a6d0993b8d2e0c33a1bdb647642ba5cb9d
      BASE: d3b167914f5dabc5a5a88a357eaeb406a1a1071e
      DOCS: 1caa96aa77b83e72a752bdd38cf0fbde31572cc5
      RECOVERY: d0dd6a9d8f1fc431754c41c38bdcf513bb7caaff
      TRANSPORT: b4ed34eaa4ae34b08234c2887a395b6834cc32b6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Run corrected reconstruction
        shell: bash
        run: |
          set -Eeuo pipefail
          python <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/rebuild-main-pr.yml').read_text()
          marker = '        run: |\n'
          if marker not in source:
              raise SystemExit('Trigger script marker not found')
          raw = source.split(marker, 1)[1]
          lines = []
          for line in raw.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line:
                  raise SystemExit(f'Unexpected trigger indentation: {line!r}')
              else:
                  lines.append('')
          script = '\n'.join(lines) + '\n'
          replacements = {
              'script, count = pattern.subn(replacement, script, count=1)':
                  'script, count = pattern.subn(lambda _match: replacement, script, count=1)',
              'exec bash /tmp/rebuild-main.sh': '''python <<'PATCHMAIN'
          from pathlib import Path

          path = Path("/tmp/rebuild-main.sh")
          text = path.read_text()
          changes = {
              "if ! git diff --quiet -- test/vendor.ts; then": "if ! git diff --quiet; then",
              "git add test/vendor.ts": "git add -A",
          }
          for old, new in changes.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one reconstruction fragment: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          PATCHMAIN
          bash -n /tmp/rebuild-main.sh
          exec bash /tmp/rebuild-main.sh''',
          }
          for old, new in replacements.items():
              if script.count(old) != 1:
                  raise SystemExit(f'Expected exactly one trigger fragment: {old}')
              script = script.replace(old, new)
          Path('/tmp/rebuild-trigger.sh').write_text(script)
          PY
          bash -n /tmp/rebuild-trigger.sh
          exec bash /tmp/rebuild-trigger.sh
