name: one-shot-interpretation-delivery

on:
  push:
    branches:
      - feature/interpretation-corpus-consolidated

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/interpretation-corpus-consolidated
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/one-shot-enforce-interpretation-delivery.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/generate/service.ts src/llm/orchestrate/plan.ts test/semanticPlanFallback.ts test/generationSemanticProvider.ts docs/interpretation-corpus.md
          git commit -m "Guarantee generic interpretation delivery on semantic failure"
          git push origin HEAD:feature/interpretation-corpus-consolidated
