name: Rebuild main history

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: cdcbd5a6d0993b8d2e0c33a1bdb647642ba5cb9d
      BASE: 0c76109cdd044c4abe55c9337524988e7bf36589
      DOCS: 1caa96aa77b83e72a752bdd38cf0fbde31572cc5
      RECOVERY: d0dd6a9d8f1fc431754c41c38bdcf513bb7caaff
      TRANSPORT: b4ed34eaa4ae34b08234c2887a395b6834cc32b6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Reconstruct, validate and publish main
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "Kitty Crow"
          git config user.email "kitty@kittycrow.dev"

          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$remote_main" == "$EXPECTED_MAIN" ]] || {
            printf 'main moved: expected %s, found %s\n' "$EXPECTED_MAIN" "$remote_main" >&2
            exit 1
          }

          commits=(
            "$BASE"
            5e142ddd0538c23ee120a005c4b646f1fe8d7cb2
            8b4275b069b745e991ab29f43b4aa49c826be491
            e03cf036bc7bc49475cf7cd829f720899f0f5596
            b73ae8eeee4b328e5877f88e86c000a3d00760ae
            fb2ea1e1cd22be8dbaeea2f30afded832484c7d7
            f7c43a39a91214cb1fdade11284a832e9c10f8e5
            0c41560be1a4558624ea571dad279bf0eff5219d
            c7537f72a05a5d07605e2f860b1ce0928691df11
            e503d520fa65b20254ee2992e7d3b1b4caaece92
            1e3d768dba3297910219f8cdee300fdc8187ba60
            9d2b5d4ebb2e523a2abd7efd2e762e2c843367f2
            ba33a7520a821b600087eff23d2e635ab0486413
            cfdb8875a5fb34fb3907a6e2cada01bcd37e931c
            "$DOCS"
            15e6937b0393f92ca521d6e0d172f68fb9aa2965
            5337e5a4b8f02860fcbe57e5ec3a97942afabce6
            fe8bd6a400f5319ed1df543413336ab741f2d9b7
            "$RECOVERY"
            "$TRANSPORT"
          )

          for sha in "${commits[@]}"; do
            git fetch --no-tags origin "$sha"
            git cat-file -e "$sha^{commit}"
          done

          SENSITIVE="$(printf '\120\145\164\145\162\150\145\141\144')"

          sanitise_vendor() {
            [[ -f test/vendor.ts ]] || return 0
            SENSITIVE="$SENSITIVE" python <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("test/vendor.ts")
          text = path.read_text()
          sensitive = os.environ["SENSITIVE"]
          text = text.replace(sensitive, "London")
          text = text.replace("57.5", "51.5")
          text = text.replace('date: "1991-06-15"', 'date: "2000-06-15"')

          text = re.sub(
              r'close\(angles\.ascendant,[\s\S]*?close\(extra\.eastPoint,[^\n]*\);\n',
              '''for (const [name, value] of Object.entries({
            ascendant: angles.ascendant,
            vertex: extra.vertex,
            eastPoint: extra.eastPoint,
          })) {
            assert(Number.isFinite(value) && value >= 0 && value < 360, `${name} is outside 0 through 360`);
          }
          ''',
              text,
          )

          text = re.sub(
              r'close\(orbit\.meanNode\.longitudeDegrees,[\s\S]*?close\(orbit\.trueApogee\.longitudeDegrees,[^\n]*\);\n',
              '''for (const [name, value] of Object.entries({
            meanNode: orbit.meanNode.longitudeDegrees,
            trueNode: orbit.trueNode.longitudeDegrees,
            meanApogee: orbit.meanApogee.longitudeDegrees,
            trueApogee: orbit.trueApogee.longitudeDegrees,
          })) {
            assert(Number.isFinite(value) && value >= 0 && value < 360, `${name} is outside 0 through 360`);
          }
          ''',
              text,
          )

          text = re.sub(
              r'const solar = eclipses\.sample\("solar", 1991\.52\);[\s\S]*?assert\(lunar\.activeHalfDurationDays > 0, "Lunar eclipse active duration is unavailable"\);',
              '''const solar = eclipses.sample("solar", 2000.5);
          assert(solar !== null, "Pinned eclipse provider returned no solar sample");
          assert(solar.activeHalfDurationDays > 0, "Solar eclipse active duration is unavailable");
          const lunar = eclipses.sample("lunar", 2000.5);
          assert(lunar !== null, "Pinned eclipse provider returned no lunar sample");
          assert(lunar.activeHalfDurationDays > 0, "Lunar eclipse active duration is unavailable");''',
              text,
          )

          if text.count("close(") == 1:
              text = re.sub(
                  r'const close = \(actual: number, expected: number, tolerance: number, message: string\): void => \{\n  assert\(Math\.abs\(actual - expected\) <= tolerance, `\$\{message\}: expected \$\{expected\}, got \$\{actual\}`\);\n\};\n',
                  "",
                  text,
              )

          text = text.replace(
              "Pinned place data did not return London",
              "Pinned place data did not return the public reference city",
          )
          text = text.replace("Unexpected London time zone", "Unexpected reference-city time zone")
          text = text.replace("Unexpected London latitude", "Unexpected reference-city latitude")
          path.write_text(text)
          PY
          }

          assert_clean_tree() {
            if git grep -I -n -F "$SENSITIVE" -- .; then
              echo "Sensitive fixture remains in the working tree" >&2
              exit 1
            fi
          }

          assert_clean_history() {
            if git log --format=%B HEAD | grep -Fqi "$SENSITIVE"; then
              echo "Sensitive fixture remains in a reachable commit message" >&2
              exit 1
            fi
            if git log -S"$SENSITIVE" --format=%H HEAD -- . | grep -q .; then
              echo "Sensitive fixture remains in reachable file history" >&2
              exit 1
            fi
          }

          commit_sanitised() {
            local source="$1"
            local subject="$2"
            local body="$3"
            local author_name author_email author_date
            author_name="$(git show -s --format=%an "$source")"
            author_email="$(git show -s --format=%ae "$source")"
            author_date="$(git show -s --format=%aI "$source")"
            GIT_AUTHOR_NAME="$author_name" \
            GIT_AUTHOR_EMAIL="$author_email" \
            GIT_AUTHOR_DATE="$author_date" \
              git commit -m "$subject" -m "$body"
          }

          git switch --detach "$BASE"
          git switch -C rebuilt-main
          assert_clean_tree
          assert_clean_history

          milestones=(
            5e142ddd0538c23ee120a005c4b646f1fe8d7cb2
            8b4275b069b745e991ab29f43b4aa49c826be491
            e03cf036bc7bc49475cf7cd829f720899f0f5596
            b73ae8eeee4b328e5877f88e86c000a3d00760ae
            fb2ea1e1cd22be8dbaeea2f30afded832484c7d7
            f7c43a39a91214cb1fdade11284a832e9c10f8e5
            0c41560be1a4558624ea571dad279bf0eff5219d
            c7537f72a05a5d07605e2f860b1ce0928691df11
            e503d520fa65b20254ee2992e7d3b1b4caaece92
            1e3d768dba3297910219f8cdee300fdc8187ba60
            9d2b5d4ebb2e523a2abd7efd2e762e2c843367f2
            ba33a7520a821b600087eff23d2e635ab0486413
            cfdb8875a5fb34fb3907a6e2cada01bcd37e931c
            "$DOCS"
            15e6937b0393f92ca521d6e0d172f68fb9aa2965
            5337e5a4b8f02860fcbe57e5ec3a97942afabce6
            fe8bd6a400f5319ed1df543413336ab741f2d9b7
          )

          for sha in "${milestones[@]}"; do
            if [[ "$sha" == 5e142ddd0538c23ee120a005c4b646f1fe8d7cb2 ]]; then
              git cherry-pick -n "$sha"
              sanitise_vendor
              git add -A
              commit_sanitised \
                "$sha" \
                "verify pinned vendor integration" \
                "Build and test the pinned submodules, add neutral place, timezone and astronomy smoke coverage, and enforce the supported runtime boundaries."
            elif [[ "$sha" == fe8bd6a400f5319ed1df543413336ab741f2d9b7 ]]; then
              git cherry-pick -n "$sha"
              sanitise_vendor
              git add -A
              commit_sanitised \
                "$sha" \
                "replace places submodule with strict TypeScript fork" \
                "Point vendor/places at kitty-crow/countrystatecity 2.1.0, adopt its npm workspace build, record the exact vendor revision and retain neutral integration coverage."
            else
              git cherry-pick "$sha"
              sanitise_vendor
              if ! git diff --quiet -- test/vendor.ts; then
                git add test/vendor.ts
                git commit --amend --no-edit
              fi
            fi
            assert_clean_tree
            assert_clean_history
          done

          git diff --binary "$DOCS" "$RECOVERY" -- . \
            ':(exclude)package.json' \
            ':(exclude)src/interface/runtime.ts' \
            ':(exclude)src/llm/openaiSchema.ts' \
            ':(exclude)test/openaiRuntime.ts' \
            ':(exclude)test/vendor.ts' \
            ':(exclude).gitmodules' \
            ':(exclude)src/vendor/revisions.ts' \
            ':(exclude)vendor/places' \
            > /tmp/recovery.patch
          git apply --3way --index /tmp/recovery.patch
          git checkout "$RECOVERY" -- src/llm/openaiSchema.ts test/openaiRuntime.ts

          python <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("test/openaiRuntime.ts")
          text = path.read_text()
          marker = '  equal(text.format?.name, "fixture", "response schema name");\n'
          addition = '''  equal(typeof requests[1]?.body["input"], "string", "structured input encoded as string");
          const encodedInput = JSON.parse(String(requests[1]?.body["input"])) as { field?: string };
          equal(encodedInput.field, "fixture", "structured input content preserved");
          '''
          if "structured input encoded as string" not in text:
              if marker not in text:
                  raise SystemExit("OpenAI runtime assertion marker not found")
              text = text.replace(marker, marker + addition)
          path.write_text(text)

          package = Path("package.json")
          data = json.loads(package.read_text())
          data["name"] = "astrology"
          data["version"] = "0.16.3"
          data["bin"] = {"astrology": "./dist/cli.js"}
          data["scripts"]["vendor:places"] = "npm --prefix vendor/places ci --ignore-scripts && npm --prefix vendor/places run build --workspace=@countrystatecity/countries"
          tests = data["scripts"]["test"]
          for item in ["node .test/test/audit.js", "node .test/test/recovery.js"]:
              if item not in tests:
                  tests += " && " + item
          data["scripts"]["test"] = tests
          data.setdefault("devDependencies", {})["tsx"] = "^4.20.6"
          package.write_text(json.dumps(data, indent=2) + "\n")

          for name in ["src/cli.ts", "src/interface/runtime.ts"]:
              file = Path(name)
              value = file.read_text()
              value = re.sub(r'(?<=version = ")\d+\.\d+\.\d+(?=")', "0.16.3", value)
              value = re.sub(r'(?<=loadApiRuntime\(config, ")\d+\.\d+\.\d+(?="\))', "0.16.3", value)
              file.write_text(value)
          PY

          sanitise_vendor
          git add -A
          git commit -m "add resumable chart generation and strict audit routing" \
            -m "Persist encrypted temporary job checkpoints, restore one conversation and completed field prefix, route model cost by field scope, strengthen semantic auditing and make clean npm installs reproducible."
          assert_clean_tree
          assert_clean_history

          git diff --binary "$RECOVERY" "$TRANSPORT" -- . \
            ':(exclude)package.json' \
            > /tmp/transport.patch
          git apply --3way --index /tmp/transport.patch

          python <<'PY'
          import json
          import re
          from pathlib import Path

          package = Path("package.json")
          data = json.loads(package.read_text())
          data["name"] = "astrology"
          data["version"] = "0.17.0"
          data["bin"] = {"astrology": "./dist/cli.js"}
          data["scripts"]["vendor:places"] = "npm --prefix vendor/places ci --ignore-scripts && npm --prefix vendor/places run build --workspace=@countrystatecity/countries"
          tests = data["scripts"]["test"]
          marker = "node .test/test/openaiRuntime.js"
          transport = "node .test/test/openaiTransport.js"
          if transport not in tests:
              tests = tests.replace(marker, transport + " && " + marker)
          data["scripts"]["test"] = tests
          data.setdefault("devDependencies", {})["tsx"] = "^4.20.6"
          package.write_text(json.dumps(data, indent=2) + "\n")

          for name in ["src/cli.ts", "src/interface/runtime.ts"]:
              file = Path(name)
              value = file.read_text()
              value = re.sub(r'(?<=version = ")\d+\.\d+\.\d+(?=")', "0.17.0", value)
              value = re.sub(r'(?<=loadApiRuntime\(config, ")\d+\.\d+\.\d+(?="\))', "0.17.0", value)
              file.write_text(value)
          PY

          sanitise_vendor
          git add -A
          git commit -m "make OpenAI calls resilient with background polling" \
            -m "Create background Responses, poll by response ID, retry transient transport failures with bounded backoff, preserve abort semantics and test the complete transport lifecycle."
          assert_clean_tree
          assert_clean_history

          blob_to_file() {
            local sha="$1"
            local path="$2"
            python - "$sha" "$path" <<'PY'
          import base64
          import json
          import os
          import sys
          import urllib.request

          sha, path = sys.argv[1:]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          with open(path, "wb") as output:
              output.write(base64.b64decode(payload["content"]))
          PY
          }

          blob_to_file 9a0716c913a037f74700ca29389026a02f354f9d src/llm/orchestrate/run.ts
          blob_to_file f884677227bc708e20b9d4bd7e7e9c52eae67b8e src/llm/orchestrate/types.ts
          blob_to_file 82678e4c565b1e68709eec9f4ab46810932dbb17 test/orchestrationResilience.ts

          python <<'PY'
          import json
          import re
          from pathlib import Path

          structured = Path("src/llm/audit/structured.ts")
          text = structured.read_text()
          old = '''  return {
            valid: state.errors.length === 0,
            value: audited,
            errors: state.errors,
          };
          '''
          new = '''  return {
            valid: state.errors.length === 0,
            value: audited,
            errors: state.errors,
            soft: state.errors.length > 0
              && state.errors.every((error) => error.endsWith("does not fit its semantic field")),
          };
          '''
          if old not in text:
              raise SystemExit("Structured-audit return block not found")
          structured.write_text(text.replace(old, new))

          plan = Path("src/llm/orchestrate/plan.ts")
          text = plan.read_text()
          old = '''      audit: (value, { calculation: calculationRoot }) => {
                const audited = auditStructured(value, calculationRoot, allowed, profile);
                if (audited.valid) prior.push(...narratives(audited.value));
                return audited;
              },
          '''
          new = '''      audit: (value, { calculation: calculationRoot }) =>
                auditStructured(value, calculationRoot, allowed, profile),
              onAccept: (value) => {
                prior.push(...narratives(value));
              },
          '''
          if old not in text:
              raise SystemExit("Interpretation-plan audit block not found")
          plan.write_text(text.replace(old, new))

          transport = Path("src/llm/openaiTransport.ts")
          text = transport.read_text()
          text = text.replace(
              "  pollTimeoutMs?: number;\n  retryAttempts?: number;",
              "  pollTimeoutMs?: number;\n  createTimeoutMs?: number;\n  retryAttempts?: number;",
          )
          text = text.replace(
              '''  const pollTimeoutMs = positive(
                options.pollTimeoutMs,
                30 * 60 * 1_000,
                "OpenAI poll timeout",
              );
          ''',
              '''  const pollTimeoutMs = positive(
                options.pollTimeoutMs,
                2 * 60 * 60 * 1_000,
                "OpenAI poll timeout",
              );

              const createTimeoutMs = positive(
                options.createTimeoutMs,
                15 * 60 * 1_000,
                "OpenAI creation timeout",
              );
          ''',
          )

          start = text.index("  const get = async (\n")
          end = text.index("  const poll = async (\n", start)
          get_block = '''  const get = async (
            url: string,
            headers: Headers,
            signal: AbortSignal | undefined,
            id: string,
            deadline: number,
          ): Promise<Response> => {
            let attempt = 0;
            let last: unknown = null;

            for (;;) {
              const remaining = deadline - Date.now();
              if (remaining <= 0) {
                throw new OpenAITransportError(
                  `OpenAI response ${id} could not be polled before its deadline`,
                  id,
                  null,
                  last,
                );
              }

              attempt += 1;
              const delay = Math.min(
                30_000,
                retryDelayMs * 2 ** Math.min(attempt - 1, retryAttempts - 1),
              );

              try {
                const response = await fetcher(url, {
                  method: "GET",
                  headers,
                  ...(signal === undefined ? {} : { signal }),
                });

                if (!transient.has(response.status)) return response;

                const wait = retryAfterMs(response) ?? delay;
                await response.body?.cancel();
                await pause(Math.min(wait, Math.max(1, deadline - Date.now())), signal);
              } catch (cause: unknown) {
                if (signal?.aborted) throw abortError(signal);
                last = cause;
                const wait = Math.min(delay, deadline - Date.now());
                if (wait <= 0) continue;
                await pause(wait, signal);
              }
            }
          };

          '''
          text = text[:start] + get_block + text[end:]
          text = text.replace(
              '''        signal,
                id,
              );
          ''',
              '''        signal,
                id,
                deadline,
              );
          ''',
              1,
          )
          text = text.replace(
              '''    if (
                !headers.has("x-client-request-id")
              ) {
                headers.set(
                  "x-client-request-id",
                  globalThis.crypto.randomUUID(),
                );
              }
          ''',
              '''    if (!headers.has("x-client-request-id")) {
                headers.set("x-client-request-id", globalThis.crypto.randomUUID());
              }
              if (!headers.has("idempotency-key")) {
                headers.set("idempotency-key", globalThis.crypto.randomUUID());
              }
          ''',
          )

          old_create = '''    const response = await fetcher(input, {
                ...init,
                headers,
                body: JSON.stringify({
                  ...body,
                  background: true,
                }),
              });
          '''
          new_create = '''    const createDeadline = Date.now() + createTimeoutMs;
              let createAttempt = 0;
              let response: Response;

              for (;;) {
                const remaining = createDeadline - Date.now();
                if (remaining <= 0) {
                  throw new OpenAITransportError(
                    `OpenAI response creation did not finish within ${createTimeoutMs} ms`,
                  );
                }

                createAttempt += 1;
                const delay = Math.min(
                  30_000,
                  retryDelayMs * 2 ** Math.min(createAttempt - 1, retryAttempts - 1),
                );

                try {
                  response = await fetcher(input, {
                    ...init,
                    headers,
                    body: JSON.stringify({
                      ...body,
                      background: true,
                    }),
                  });

                  if (!transient.has(response.status)) break;
                  const wait = retryAfterMs(response) ?? delay;
                  await response.body?.cancel();
                  await pause(Math.min(wait, Math.max(1, createDeadline - Date.now())), signal);
                } catch (cause: unknown) {
                  if (signal?.aborted) throw abortError(signal);
                  const wait = Math.min(delay, createDeadline - Date.now());
                  if (wait <= 0) {
                    throw new OpenAITransportError(
                      `OpenAI response creation did not finish within ${createTimeoutMs} ms`,
                      null,
                      null,
                      cause,
                    );
                  }
                  await pause(wait, signal);
                }
              }
          '''
          if old_create not in text:
              raise SystemExit("OpenAI creation block not found")
          transport.write_text(text.replace(old_create, new_create))

          package = Path("package.json")
          data = json.loads(package.read_text())
          data["name"] = "astrology"
          data["version"] = "0.18.0"
          data["bin"] = {"astrology": "./dist/cli.js"}
          data["scripts"]["vendor:places"] = "npm --prefix vendor/places ci --ignore-scripts && npm --prefix vendor/places run build --workspace=@countrystatecity/countries"
          ordered = [
              "node .test/test/run.js",
              "node .test/test/calculation.js",
              "node .test/test/geometry.js",
              "node .test/test/points.js",
              "node .test/test/dignity.js",
              "node .test/test/derived.js",
              "node .test/test/patterns.js",
              "node .test/test/eclipses.js",
              "node .test/test/compatibility.js",
              "node .test/test/service.js",
              "node .test/test/interfaces.js",
              "node .test/test/chartFile.js",
              "node .test/test/audit.js",
              "node .test/test/openaiTransport.js",
              "node .test/test/openaiRuntime.js",
              "node .test/test/orchestrationResilience.js",
              "node .test/test/recovery.js",
          ]
          data["scripts"]["test"] = "rm -rf .test && tsc -p tsconfig.test.json && " + " && ".join(ordered)
          data.setdefault("devDependencies", {})["tsx"] = "^4.20.6"
          package.write_text(json.dumps(data, indent=2) + "\n")

          for name in ["src/cli.ts", "src/interface/runtime.ts"]:
              file = Path(name)
              value = file.read_text()
              value = re.sub(r'(?<=version = ")\d+\.\d+\.\d+(?=")', "0.18.0", value)
              value = re.sub(r'(?<=loadApiRuntime\(config, ")\d+\.\d+\.\d+(?="\))', "0.18.0", value)
              file.write_text(value)

          docs = Path("docs/interpretation.md")
          value = docs.read_text()
          if "Soft semantic recovery" not in value:
              value += '''

          ## Soft semantic recovery

          A generic semantic-fit miss retries the same field once in the same conversation. If the corrected field still misses only that broad lexical heuristic, the structurally valid and source-grounded result is accepted with a warning so one weak heuristic cannot terminate a long chart. Process narration, placeholders, forbidden formatting, invalid references, structural errors and cross-field duplication remain hard failures.

          Background response creation retries transient transport failures with one idempotency key for up to fifteen minutes. Polling then continues through transient network and HTTP failures until the response completes or reaches the two-hour response deadline.
          '''
          docs.write_text(value)
          PY

          cat > test/transportCreationResilience.ts <<'TS'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { createOpenAITransport } from "../src/llm/openaiTransport.js";

          test("background creation retries a transient headers failure", async () => {
            let posts = 0;
            let polls = 0;

            const fake: typeof fetch = async (_input, init) => {
              if (init?.method === "POST") {
                posts += 1;
                if (posts === 1) throw new TypeError("fetch failed");
                return new Response(JSON.stringify({ id: "resp_retry", status: "queued" }), {
                  status: 200,
                  headers: { "content-type": "application/json" },
                });
              }

              polls += 1;
              return new Response(JSON.stringify({
                id: "resp_retry",
                status: "completed",
                output_text: JSON.stringify({ value: "ok" }),
              }), {
                status: 200,
                headers: { "content-type": "application/json" },
              });
            };

            const resilient = createOpenAITransport({
              fetch: fake,
              pollIntervalMs: 1,
              pollTimeoutMs: 1_000,
              createTimeoutMs: 1_000,
              retryAttempts: 2,
              retryDelayMs: 1,
            });

            const response = await resilient("https://example.invalid/v1/responses", {
