name: privacy-rewrite-run

on:
  push:
    branches:
      - agent/privacy-rewrite
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - shell: bash
        run: |
          set -Eeuo pipefail
          cp scripts/privacy-rewrite.sh /tmp/privacy-rewrite.sh
          rm -f scripts/privacy-rewrite.sh .github/workflows/privacy-rewrite-run.yml
          python <<'PY'
          from pathlib import Path
          path = Path('/tmp/privacy-rewrite.sh')
          text = path.read_text(encoding='utf-8')

          old = '''for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

          path = Path("test/geometry.ts")'''
          new = '''for old, new in replacements.items():
              text = text.replace(old, new)
          text = text.replace("Aberdeen", "Cambridge")
          path.write_text(text, encoding="utf-8")

          path = Path("test/geometry.ts")'''
          if old not in text:
              raise SystemExit('calculation patch point not found')
          text = text.replace(old, new, 1)

          marker = 'forbidden = ["Peterhead", "57.505", "-1.784", "1991", "Aberdeen"]'
          insert = '''for name in ["test/derived.ts", "test/points.ts"]:
              fixture = Path(name)
              value = fixture.read_text(encoding="utf-8")
              value = value.replace("-1.784", "0").replace("57.505", "0")
              value = value.replace("independent fixture", "synthetic equatorial fixture")
              if name == "test/points.ts":
                  value = value.replace("336.2768392553082", "180")
                  value = value.replace("156.2768392553082", "0")
                  value = value.replace("162.61072224422642", "164.53056064550913")
              fixture.write_text(value, encoding="utf-8")

          ''' + marker
          if marker not in text:
              raise SystemExit('coordinate patch point not found')
          text = text.replace(marker, insert, 1)
          path.write_text(text, encoding='utf-8')
          PY
          bash /tmp/privacy-rewrite.sh
