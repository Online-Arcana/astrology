name: privacy-rewrite-run

on:
  push:
    branches:
      - agent/privacy-rewrite
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - shell: bash
        run: |
          set -Eeuo pipefail
          cp scripts/privacy-rewrite.sh /tmp/privacy-rewrite.sh
          rm -f scripts/privacy-rewrite.sh .github/workflows/privacy-rewrite-run.yml
          bash /tmp/privacy-rewrite.sh
