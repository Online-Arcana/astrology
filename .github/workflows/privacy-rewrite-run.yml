name: privacy-rewrite-run

on:
  push:
    branches:
      - agent/privacy-rewrite

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: bash scripts/privacy-rewrite.sh
