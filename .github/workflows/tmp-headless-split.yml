name: tmp-headless-split
on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-headless-split.yml]
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/split-modules
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build headless tree
        run: |
          set -euo pipefail
          rm -rf /tmp/old-src /tmp/old-test
          cp -a src /tmp/old-src
          cp -a test /tmp/old-test
          rm -rf src public scripts docs test vendor dist .test package-lock.json
          mkdir -p src/types src/calc src/generate src/interface src/file test
          cp -a /tmp/old-src/file src/file
          cp -a /tmp/old-src/generate/* src/generate/
          cp -a /tmp/old-src/interface/* src/interface/
          cp /tmp/old-src/cli.ts src/cli.ts
          cp /tmp/old-src/types/file.ts src/types/file.ts
          cp /tmp/old-src/types/legacy.ts src/types/legacy.ts

          cat > src/types/base.ts <<'TS'
          export type { BirthInput, BirthData, Calc, CalcReason, CalcStatus, Json, JsonRef, PlaceData, TimeData, TimeWindow } from "astral-core";
          export type PreferredGender = "male" | "female" | "non-binary";
          export const preferredGenderOf = (value: { preferredGender?: PreferredGender }): PreferredGender => value.preferredGender ?? "male";
          TS
          cat > src/types/astro.ts <<'TS'
          export * from "astral-core";
          TS
          cat > src/types/chart.ts <<'TS'
          export type { AstralChart } from "astral-interpreter";
          TS
          cat > src/types/progress.ts <<'TS'
          export type { ProgressEvent } from "astral-interpreter";
          TS
          cat > src/types/index.ts <<'TS'
          export * from "./base.js";
          export * from "./astro.js";
          export * from "./chart.js";
          export * from "./file.js";
          export * from "./legacy.js";
          export * from "./progress.js";
          TS

          cat > src/config.ts <<'TS'
          import type { Ayanamsha, Zodiac } from "astral-core";
          import { readConfig as readInterpreterConfig, type Config as InterpreterConfig } from "astral-interpreter";
          export type Env = Readonly<Record<string, string | undefined>>;
          export interface Config extends InterpreterConfig {
            core: { zodiac: Zodiac; ayanamsha: Ayanamsha };
            signing: { enabled: boolean; issuer: string; privateKey: string | null; publicKey: string | null };
          }
          const oneOf = <T extends string>(value: string | undefined, fallback: T, values: readonly T[], key: string): T => {
            const selected=value??fallback; if(!values.includes(selected as T)) throw new Error(`${key} has an unsupported value`); return selected as T;
          };
          const bool = (value: string | undefined, fallback: boolean, key: string): boolean => {
            if(value===undefined||value==="") return fallback; if(value==="true") return true; if(value==="false") return false; throw new Error(`${key} must be true or false`);
          };
          export const readConfig = (env: Env): Config => {
            const interpreter=readInterpreterConfig(env);
            const zodiac=oneOf(env["ASTRAL_PRIMARY_ZODIAC"],"tropical",["tropical","sidereal"] as const,"ASTRAL_PRIMARY_ZODIAC");
            if(env["ASTRAL_INTERPRETATION_MODE"]!==undefined && env["ASTRAL_INTERPRETATION_MODE"]!==zodiac) throw new Error("ASTRAL_INTERPRETATION_MODE must match ASTRAL_PRIMARY_ZODIAC");
            const enabled=bool(env["ASTRAL_SIGNING_ENABLED"],false,"ASTRAL_SIGNING_ENABLED");
            const privateKey=env["ASTRAL_ED25519_PRIVATE_KEY"]||null; const publicKey=env["ASTRAL_ED25519_PUBLIC_KEY"]||null;
            if(enabled&&(!privateKey||!publicKey)) throw new Error("Signing requires both Ed25519 keys");
            return {
              ...interpreter,
              core: { zodiac, ayanamsha: oneOf(env["ASTRAL_SIDEREAL_AYANAMSHA"],"lahiri",["lahiri","fagan_bradley","krishnamurti","raman"] as const,"ASTRAL_SIDEREAL_AYANAMSHA") },
              signing: { enabled, issuer: env["ASTRAL_AUTHORITY_ISSUER"]??"Online-Arcana/astrology", privateKey, publicKey },
            };
          };
          TS

          cat > src/calc/runtime.ts <<'TS'
          import { calc, loadPorts, type BirthInput, type CalcOptions, type CalcPorts, type Calculation } from "astral-core";
          import { prepare, type AstralCalculation, type PreferredGender } from "astral-interpreter";
          import type { Config } from "../config.js";
          export interface CalcInput extends BirthInput { name?: string; lang?: string; preferredGender?: PreferredGender; }
          export interface CalcSettings { primaryZodiac: CalcOptions["zodiac"]; ayanamsha: CalcOptions["ayanamsha"]; interpretationMode: CalcOptions["zodiac"]; }
          export interface CalcApi { calculate(input: CalcInput, options: CalcSettings): Promise<AstralCalculation>; }
          export const calcSettings = (config: Config): CalcSettings => ({ primaryZodiac: config.core.zodiac, ayanamsha: config.core.ayanamsha, interpretationMode: config.core.zodiac });
          export const calcApi = (ports: CalcPorts): CalcApi => ({
            calculate: async (input, options) => {
              if(options.primaryZodiac!==options.interpretationMode) throw new Error("Calculation and interpretation zodiac must match");
              const base: BirthInput={ date: input.date, time: input.time, timeAccuracy: input.timeAccuracy, placeId: input.placeId };
              const calculation: Calculation=await calc(base,{ zodiac: options.primaryZodiac, ayanamsha: options.ayanamsha },ports);
              return prepare(calculation,{ name: input.name, language: input.lang, gender: input.preferredGender });
            },
          });
          export const loadCalc = async (version="0.20.0"): Promise<CalcApi> => calcApi(await loadPorts(version));
          TS

          python3 - <<'PY'
          from pathlib import Path
          replacements={
            '../billing/':'astral-interpreter#',
            '../chart/':'astral-interpreter#',
            '../interpretation/':'astral-interpreter#',
            '../llm/':'astral-interpreter#',
            '../job/':'astral-interpreter#',
            '../progress/':'astral-interpreter#',
            '../ref/':'astral-interpreter#',
            '../calculate/service.js':'../calc/runtime.js',
            '../place/model.js':'astral-core',
            '../place/csc.js':'astral-core',
          }
          for p in Path('src').rglob('*.ts'):
            s=p.read_text()
            for old,new in replacements.items():
              if new.endswith('#'):
                import re
                prefix=new[:-1]
                s=re.sub(r'(["\'])'+re.escape(old)+r'[^"\']+\.js\1', lambda m: m.group(1)+prefix+m.group(1), s)
              else: s=s.replace(f'"{old}"',f'"{new}"').replace(f"'{old}'",f"'{new}'")
            p.write_text(s)
          PY

          # Patch generation to use the composition adapter and interpreter exports.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/generate/service.ts'); s=p.read_text()
          s=s.replace('CalculationService,\n  loadCalculationPorts,\n  type CalculationOptions,','loadCalc,\n  calcSettings,\n  type CalcApi,\n  type CalcSettings,')
          s=s.replace('Pick<CalculationService, "calculate">','CalcApi')
          s=s.replace('CalculationOptions','CalcSettings')
          s=s.replace('const optionsFromConfig = (config: Config): CalcSettings => ({\n  primaryZodiac: config.chart.primaryZodiac,\n  ayanamsha: config.chart.ayanamsha,\n  interpretationMode: config.chart.interpretationMode,\n});','const optionsFromConfig = calcSettings;')
          s=s.replace('config.chart.primaryZodiac','config.core.zodiac').replace('config.chart.interpretationMode','config.core.zodiac').replace('config.chart.ayanamsha','config.core.ayanamsha')
          s=s.replace('  const ports = await loadCalculationPorts(version);\n  const calculation = new CalculationService(ports);','  const calculation = await loadCalc(version);')
          p.write_text(s)
          PY

          # API imports/types and health identity.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/interface/api.ts'); s=p.read_text()
          s=s.replace('import { CalculationUnavailableError, type CalculationOptions, type CalculationService } from "../calc/runtime.js";', 'import { CalcError } from "astral-core";\nimport type { CalcApi, CalcSettings } from "../calc/runtime.js";')
          s=s.replace('CalculationUnavailableError','CalcError').replace('Pick<CalculationService, "calculate">','CalcApi').replace('CalculationOptions','CalcSettings')
          s=s.replace('service: "astral-charts"','service: "astrology"')
          p.write_text(s)
          PY

          # Runtime loader now composes core + interpreter + packager-facing API.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/interface/runtime.ts'); s=p.read_text()
          s=s.replace('import { loadCalculationPorts, CalculationService } from "../calculate/service.js";', 'import { loadPorts } from "astral-core";\nimport { calcApi, calcSettings } from "../calc/runtime.js";')
          s=s.replace('new CalculationService(ports)','calcApi(ports)').replace('loadCalculationPorts','loadPorts')
          s=s.replace('primaryZodiac: config.chart.primaryZodiac,\n    ayanamsha: config.chart.ayanamsha,\n    interpretationMode: config.chart.interpretationMode,','...calcSettings(config),')
          p.write_text(s)
          PY

          # Request parser uses local composition settings.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/interface/request.ts'); s=p.read_text().replace('import type { CalculationOptions } from "../calculate/service.js";', 'import type { CalcSettings } from "../calc/runtime.js";').replace('CalculationOptions','CalcSettings'); p.write_text(s)
          p=Path('src/interface/cliArgs.ts'); s=p.read_text().replace('import type { CalculationOptions } from "../calculate/service.js";', 'import type { CalcSettings } from "../calc/runtime.js";').replace('CalculationOptions','CalcSettings'); p.write_text(s)
          PY

          cat > src/index.ts <<'TS'
          export * from "astral-core";
          export * from "astral-interpreter";
          export { auditPwd, open, pack, pwdOk, readMeta, readPub, readPubRaw, readWheel, pwdMin, Id } from "astral-packager";
          export * from "./config.js";
          export * from "./types/index.js";
          export * from "./calc/runtime.js";
          export * from "./file/canonical.js";
          export * from "./file/codec.js";
          export * from "./file/crc32c.js";
          export * from "./file/hash.js";
          export * from "./file/integrity.js";
          export * from "./file/authority.js";
          export * from "./file/invariants.js";
          export * from "./file/document.js";
          export * from "./file/validate.js";
          export * from "./generate/service.js";
          export * from "./interface/request.js";
          export * from "./interface/api.js";
          export * from "./interface/runtime.js";
          export * from "./interface/server.js";
          export * from "./interface/cliArgs.js";
          TS

          cat > package.json <<'JSON'
          {
            "name": "astrology",
            "version": "0.21.0",
            "description": "Headless astrology API and CLI",
            "type": "module",
            "private": true,
            "license": "MIT",
            "bin": { "astrology": "./dist/cli.js" },
            "engines": { "node": ">=22" },
            "scripts": {
              "vendor:core": "npm --prefix vendor/astral-core run vendor:build && npm --prefix vendor/astral-core install --ignore-scripts && npm --prefix vendor/astral-core run build",
              "vendor:interpreter": "npm --prefix vendor/astral-interpreter run vendor:build && npm --prefix vendor/astral-interpreter install --ignore-scripts && npm --prefix vendor/astral-interpreter run build",
              "vendor:packager": "npm --prefix vendor/astral-packager run build",
              "vendor:build": "npm run vendor:core && npm run vendor:interpreter && npm run vendor:packager",
              "check": "tsc -p tsconfig.json --noEmit",
              "build": "rm -rf dist && tsc -p tsconfig.build.json",
              "test": "rm -rf .test && tsc -p tsconfig.test.json && node .test/test/run.js",
              "ci": "npm run check && npm run test && npm run build",
              "start": "node dist/cli.js serve"
            },
            "dependencies": {
              "astral-core": "file:vendor/astral-core",
              "astral-interpreter": "file:vendor/astral-interpreter",
              "astral-packager": "file:vendor/astral-packager"
            },
            "devDependencies": { "@types/node": "^22.15.3", "typescript": "^5.9.3" }
          }
          JSON
          cp /tmp/old-test/run.ts test/run.ts
          cp tsconfig.json /tmp/tsconfig-old.json
          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2023", "module": "NodeNext", "moduleResolution": "NodeNext", "lib": ["ES2023", "DOM"],
              "strict": true, "exactOptionalPropertyTypes": true, "noUncheckedIndexedAccess": true, "noImplicitOverride": true,
              "noFallthroughCasesInSwitch": true, "noImplicitReturns": true, "noPropertyAccessFromIndexSignature": true,
              "useUnknownInCatchVariables": true, "verbatimModuleSyntax": true, "skipLibCheck": false, "allowImportingTsExtensions": true
            },
            "include": ["src/**/*.ts"]
          }
          JSON
          cat > tsconfig.build.json <<'JSON'
          { "extends":"./tsconfig.json", "compilerOptions": { "noEmit":false, "allowImportingTsExtensions":false, "declaration":true, "declarationMap":true, "sourceMap":true, "outDir":"dist", "rootDir":"src" }, "include":["src/**/*.ts"] }
          JSON
          cat > tsconfig.test.json <<'JSON'
          { "extends":"./tsconfig.json", "compilerOptions": { "noEmit":false, "allowImportingTsExtensions":false, "outDir":".test", "rootDir":".", "declaration":false, "sourceMap":false }, "include":["src/**/*.ts","test/**/*.ts"] }
          JSON
          cat > .gitmodules <<'EOF'
          [submodule "vendor/astral-core"]
            path = vendor/astral-core
            url = https://github.com/Online-Arcana/astral-chart-wheel.git
          [submodule "vendor/astral-interpreter"]
            path = vendor/astral-interpreter
            url = https://github.com/Online-Arcana/astral-interpreter.git
          [submodule "vendor/astral-packager"]
            path = vendor/astral-packager
            url = https://github.com/Online-Arcana/astral-packager.git
          EOF
          git submodule add -f https://github.com/Online-Arcana/astral-chart-wheel.git vendor/astral-core
          git -C vendor/astral-core fetch origin agent/split-modules && git -C vendor/astral-core checkout d909d05abce71cf6215a20387fa0de8ae4b37776
          git submodule add -f https://github.com/Online-Arcana/astral-interpreter.git vendor/astral-interpreter
          git -C vendor/astral-interpreter fetch origin agent/split-modules && git -C vendor/astral-interpreter checkout 39430d25d6fea1203d53e05f8dabe6d3dcd87e57
          git submodule add -f https://github.com/Online-Arcana/astral-packager.git vendor/astral-packager
          git -C vendor/astral-packager checkout 157ddc810c0dc2429b68990c3d35fccf2d653dda
          git -C vendor/astral-core submodule update --init --recursive
          git -C vendor/astral-interpreter submodule update --init --recursive
          npm run vendor:build
          npm install --ignore-scripts
          npm run check
          rm -rf /tmp/old-src /tmp/old-test
          git config user.name github-actions[bot]
          git config user.email 41898282+kitty-crow@users.noreply.github.com
          git add -A
          git commit -m "Split astrology into headless composition"
          git push origin HEAD:agent/split-modules
