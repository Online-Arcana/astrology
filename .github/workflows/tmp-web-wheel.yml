name: tmp-web-wheel

on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-web-wheel.yml]

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/split-modules
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Expose browser-safe wheel API
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/web.ts')
          s=p.read_text()
          anchor='export { webPlaces, webPorts } from "astral-core/web";\n'
          addition='export { renderWheel, wheelData, renderPublicWheel, fromPublic } from "astral-core/wheel";\nexport type { WheelData, PublicWheelMeta } from "astral-core/wheel";\n'
          if addition not in s:
              if anchor not in s: raise SystemExit('web export anchor missing')
              s=s.replace(anchor, anchor+addition)
          p.write_text(s)
          PY
          npm run vendor:core
          npm --prefix vendor/astral-packager run build
          npm ci
          npm run check
          npm test
          npm run build
          node --input-type=module - <<'NODE'
          const web = await import('./dist/web.js');
          for (const name of ['renderWheel','wheelData','renderPublicWheel','fromPublic']) {
            if (typeof web[name] !== 'function') throw new Error(`${name} missing from astrology/web`);
          }
          NODE
          git restore --source=HEAD --staged --worktree .github/workflows || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/web.ts
          git add -f dist/web.*
          git commit -m "Expose wheel API from astrology web entry"
          git pull --rebase origin agent/split-modules
          git push origin HEAD:agent/split-modules
