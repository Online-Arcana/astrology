name: ci

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: corepack enable
      - run: npm run vendor:build
      - run: npm install --ignore-scripts
      - run: npm run ci
      - run: npm run test:vendor
