name: tmp-split-node-loaders

on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-split-node-loaders.yml]

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/split-modules
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Split Node loaders from browser-safe services
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/calculate/service.ts')
          s=p.read_text()
          s=s.replace('import type { Config } from "../config.js";\n', '')
          s=re.sub(
              r'const optionsFromConfig = \(config: Config\): CalculationOptions => \(\{[\s\S]*?\}\);\n',
              '',
              s,
              count=1,
          )
          marker='export const loadCalculationPorts = async '
          if marker not in s:
              raise SystemExit('calculation Node loader marker missing')
          s=s.split(marker,1)[0].rstrip()+'\n'
          p.write_text(s)

          Path('src/calculate/node.ts').write_text('''import { loadPorts } from "astral-core";\nimport type { Config } from "../config.js";\nimport {\n  CalculationService,\n  type CalculationOptions,\n  type CalculationPorts,\n} from "./service.js";\n\nconst optionsFromConfig = (config: Config): CalculationOptions => ({\n  primaryZodiac: config.chart.primaryZodiac,\n  ayanamsha: config.chart.ayanamsha,\n  interpretationMode: config.chart.interpretationMode,\n});\n\nexport const loadCalculationPorts = async (version = "0.20.0"): Promise<CalculationPorts> =>\n  loadPorts(version);\n\nexport const loadCalculationService = async (\n  config: Config,\n  version = "0.20.0",\n): Promise<{ service: CalculationService; options: CalculationOptions }> => ({\n  service: new CalculationService(await loadCalculationPorts(version)),\n  options: optionsFromConfig(config),\n});\n''')

          p=Path('src/generate/service.ts')
          s=p.read_text()
          s=s.replace('  loadCalculationPorts,\n', '')
          marker='export const loadChartGenerationService = async '
          if marker not in s:
              raise SystemExit('generation Node loader marker missing')
          s=s.split(marker,1)[0].rstrip()+'\n'
          p.write_text(s)

          Path('src/generate/node.ts').write_text('''import type { InterpretationSemanticProvider, OpenAISchemaRuntimeOptions } from "astral-interpreter/web";\nimport { CalculationService } from "../calculate/service.js";\nimport { loadCalculationPorts } from "../calculate/node.js";\nimport type { Config } from "../config.js";\nimport {\n  createChartGenerationService,\n  type ChartGenerationService,\n} from "./service.js";\n\nexport const loadChartGenerationService = async (\n  config: Config,\n  version = "0.20.0",\n  openai: Partial<Omit<OpenAISchemaRuntimeOptions, "apiKey" | "instructions" | "metadata" | "onUsage">> = {},\n  semanticProvider: InterpretationSemanticProvider | null = null,\n): Promise<ChartGenerationService> => {\n  const ports = await loadCalculationPorts(version);\n  return createChartGenerationService(\n    new CalculationService(ports),\n    config,\n    version,\n    openai,\n    semanticProvider,\n  );\n};\n''')

          p=Path('src/index.ts')
          s=p.read_text()
          s=s.replace(
              'export * from "./calculate/service.js";\n',
              'export * from "./calculate/service.js";\nexport * from "./calculate/node.js";\n'
          )
          s=s.replace(
              'export * from "./generate/service.js";\n',
              'export * from "./generate/service.js";\nexport * from "./generate/node.js";\n'
          )
          p.write_text(s)
          PY

          npm --prefix vendor/astral-packager run build
          npm ci
          npm run check
          npm test
          npm run build

          node --input-type=module - <<'NODE'
          const root = await import('./dist/index.js');
          for (const name of ['loadCalculationPorts','loadCalculationService','loadChartGenerationService']) {
            if (typeof root[name] !== 'function') throw new Error(`${name} missing from root API`);
          }
          const web = await import('./dist/web.js');
          for (const name of ['CalculationService','createChartGenerationService','loadWebChartGenerationService']) {
            if (typeof web[name] !== 'function') throw new Error(`${name} missing from web API`);
          }
          NODE

          ! grep -q 'import("astral-core")' dist/calculate/service.js
          ! grep -q 'astral-core"' dist/generate/service.js
          grep -q 'from "astral-core"' dist/calculate/node.js
          grep -q 'loadCalculationPorts' dist/generate/node.js

          git restore --source=HEAD --staged --worktree .github/workflows || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/calculate src/generate src/index.ts
          git add -f dist
          git commit -m "Separate Node loaders from browser composition"
          git pull --rebase origin agent/split-modules
          git push origin HEAD:agent/split-modules
