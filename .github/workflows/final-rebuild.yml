          import assert from "node:assert/strict";
          import test from "node:test";
          import { createOpenAITransport } from "../src/llm/openaiTransport.js";

          test("background creation retries a transient headers failure", async () => {
            let posts = 0;
            let polls = 0;
            const keys: string[] = [];

            const fake: typeof fetch = async (_input, init) => {
              if (init?.method === "POST") {
                posts += 1;
                keys.push(new Headers(init.headers).get("idempotency-key") ?? "");
                if (posts === 1) throw new TypeError("fetch failed");
                return new Response(JSON.stringify({ id: "resp_retry", status: "queued" }), {
                  status: 200,
                  headers: { "content-type": "application/json" },
                });
              }

              polls += 1;
              return new Response(JSON.stringify({
                id: "resp_retry",
                status: "completed",
                output_text: JSON.stringify({ value: "ok" }),
              }), {
                status: 200,
                headers: { "content-type": "application/json" },
              });
            };

            const resilient = createOpenAITransport({
              fetch: fake,
              pollIntervalMs: 1,
              pollTimeoutMs: 1_000,
              createTimeoutMs: 1_000,
              retryAttempts: 2,
              retryDelayMs: 1,
            });

            const response = await resilient("https://example.invalid/v1/responses", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ model: "gpt-test" }),
            });

            assert.equal(posts, 2);
            assert.equal(polls, 1);
            assert.equal(keys[0], keys[1]);
            assert.notEqual(keys[0], "");
            assert.equal((await response.json() as { status?: string }).status, "completed");
          });
          TS

